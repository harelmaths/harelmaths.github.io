<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harel Maths</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #ffffff);
      color: #172033;
    }
    main {
      width: min(720px, 100%);
      background: #ffffff;
      border-radius: 20px;
      padding: 48px 36px;
      box-shadow: 0 18px 50px rgba(30, 55, 100, 0.12);
      text-align: center;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.2rem, 6vw, 4rem);
      color: #183b7a;
    }
    p {
      margin: 0;
      font-size: 1.15rem;
      line-height: 1.7;
      color: #4b5568;
    }
  </style>
</head>
<body>
  <main>
    <h1>Harel Maths</h1>
    <p>Bienvenue sur le site Harel Maths.</p>
  </main>
</body>
</html>
