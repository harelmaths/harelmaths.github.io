<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harel Maths</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.55), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.35), transparent 25%),
        linear-gradient(135deg, #e8f0ff 0%, #f6f9ff 45%, #eef7ff 100%);
      color: #1c2740;
    }

    .banner {
      position: relative;
      overflow: hidden;
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background:
        linear-gradient(135deg, rgba(20, 55, 122, 0.95), rgba(52, 114, 214, 0.92)),
        linear-gradient(120deg, #123c8c, #5aa2ff);
      color: white;
    }

    .banner::before,
    .banner::after {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .banner::before {
      content: "";
      background-image:
        linear-gradient(rgba(255,255,255,0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.09) 1px, transparent 1px);
      background-size: 34px 34px;
      opacity: 0.35;
    }

    .banner::after {
      content: "π   x²   √9   ∑   a+b   3/4   ∞   7×8=56   △   y=mx+b   2+2=4";
      white-space: pre-wrap;
      font-size: clamp(1rem, 2vw, 1.45rem);
      line-height: 2.3;
      letter-spacing: 0.14em;
      color: rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }

    .banner-content {
      position: relative;
      z-index: 1;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 24px;
      padding: 34px 26px;
      backdrop-filter: blur(4px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 14px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 3vw, 2.55rem);
      font-weight: 700;
    }

    .subtitle {
      margin-top: 14px;
      font-size: clamp(1.1rem, 2vw, 1.45rem);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .location {
      margin-top: 8px;
      font-size: clamp(1rem, 1.8vw, 1.22rem);
      opacity: 0.95;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 46px 22px 70px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 32px 28px;
      box-shadow: 0 14px 34px rgba(42, 70, 130, 0.10);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 14px;
      color: #173b7a;
      font-size: 1.65rem;
    }

    .card p {
      margin: 0;
      line-height: 1.75;
      font-size: 1.07rem;
      color: #42506b;
    }
  </style>
</head>
<body>
  <header class="banner">
    <div class="banner-content">
      <div class="eyebrow">Mathématiques</div>
      <h1>Site de Mme Harel</h1>
      <div class="subtitle">Collège Albert Camus</div>
      <div class="location">La Norville</div>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Bienvenue</h2>
      <p>
        Bienvenue sur le site de mathématiques de Mme Harel. Vous y trouverez progressivement
        des ressources, des cours, des exercices et différentes informations utiles pour les élèves.
      </p>
    </section>
  </main>
</body>
</html>
