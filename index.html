<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site de Mme Harel</title>
  <style>
    :root {
      --ink: #111827;
      --muted: #64748b;
      --paper: #f5f7fb;
      --night: #07111f;
      --night2: #0b1b33;
      --cyan: #6ee7ff;
      --violet: #8b5cf6;
      --blue: #3b82f6;
      --gold: #f8d57e;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(59,130,246,.08), transparent 28%),
        radial-gradient(circle at 90% 30%, rgba(139,92,246,.08), transparent 26%),
        var(--paper);
    }

    .hero {
      position: relative;
      min-height: 440px;
      overflow: hidden;
      isolation: isolate;
      color: white;
      background:
        radial-gradient(circle at 20% 20%, rgba(110,231,255,.18), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(139,92,246,.26), transparent 30%),
        linear-gradient(135deg, var(--night) 0%, #0a1630 48%, var(--night2) 100%);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -3;
      opacity: .26;
      background-image:
        linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black 30%, transparent 96%);
    }

    .aurora {
      position: absolute;
      inset: -35% -10% auto;
      height: 290px;
      background: linear-gradient(90deg, rgba(110,231,255,.20), rgba(59,130,246,.08), rgba(139,92,246,.22));
      filter: blur(70px);
      transform: rotate(-6deg);
      z-index: -2;
    }

    .orbit {
      position: absolute;
      width: 480px;
      height: 480px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 50%;
      right: -130px;
      top: -105px;
      z-index: -1;
    }

    .orbit::before,
    .orbit::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(110,231,255,.16);
      border-radius: 50%;
      inset: 54px;
    }

    .orbit::after {
      inset: 112px;
      border-color: rgba(248,213,126,.20);
    }

    .formula {
      position: absolute;
      font-family: Georgia, "Times New Roman", serif;
      color: rgba(255,255,255,.19);
      user-select: none;
      letter-spacing: .03em;
      animation: drift 8s ease-in-out infinite;
    }

    .f1 { left: 5%; top: 14%; font-size: 1.4rem; }
    .f2 { right: 11%; top: 16%; font-size: 1.1rem; animation-delay: -2s; }
    .f3 { left: 8%; bottom: 15%; font-size: 1.1rem; animation-delay: -4s; }
    .f4 { right: 22%; bottom: 12%; font-size: 1.25rem; animation-delay: -1s; }

    @keyframes drift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .hero-inner {
      width: min(1180px, calc(100% - 40px));
      min-height: 440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      align-items: center;
      gap: 48px;
      padding: 66px 0 76px;
    }

    .hero-copy {
      position: relative;
      z-index: 2;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 13px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
      color: #dbeafe;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .10em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 18px var(--cyan);
    }

    h1 {
      margin: 22px 0 12px;
      font-size: clamp(2rem, 4.2vw, 3.6rem);
      line-height: 1.02;
      letter-spacing: -.04em;
      font-weight: 800;
    }

    h1 .soft {
      display: block;
      margin-top: 8px;
      font-size: .46em;
      font-weight: 600;
      letter-spacing: .01em;
      color: #cbd5e1;
    }

    .school {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #eef6ff;
      font-size: clamp(1rem, 1.7vw, 1.18rem);
      font-weight: 600;
    }

    .school::before {
      content: "";
      width: 36px;
      height: 1px;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
    }

    .place {
      margin-top: 7px;
      color: #94a3b8;
      font-size: .95rem;
      padding-left: 48px;
    }

    .visual {
      position: relative;
      height: 300px;
      display: grid;
      place-items: center;
    }

    .math-card {
      position: relative;
      width: min(360px, 100%);
      aspect-ratio: 1.15;
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.045));
      border: 1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 80px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
      overflow: hidden;
      transform: rotate(2deg);
    }

    .math-card::before {
      content: "";
      position: absolute;
      inset: -60px auto auto -50px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: rgba(110,231,255,.12);
      filter: blur(12px);
    }

    .math-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .wave {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 56px;
    }

    main {
      width: min(1080px, calc(100% - 40px));
      margin: -18px auto 0;
      position: relative;
      z-index: 3;
      padding-bottom: 70px;
    }

    .welcome {
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 24px;
      padding: 28px 30px;
      box-shadow: 0 20px 45px rgba(15,23,42,.09);
    }

    .welcome h2 {
      margin: 0 0 9px;
      font-size: 1.35rem;
      letter-spacing: -.02em;
      color: #0f172a;
    }

    .welcome p {
      margin: 0;
      line-height: 1.72;
      color: var(--muted);
      font-size: 1rem;
    }

    @media (max-width: 760px) {
      .hero { min-height: 520px; }
      .hero-inner {
        min-height: 520px;
        grid-template-columns: 1fr;
        gap: 24px;
        text-align: center;
        padding: 54px 0 84px;
      }
      .school { justify-content: center; }
      .place { padding-left: 0; }
      .visual { height: 190px; }
      .math-card { width: 250px; }
      .f2, .f4 { display: none; }
      .orbit { width: 360px; height: 360px; right: -180px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="aurora"></div>
    <div class="orbit"></div>
    <div class="formula f1">πr²</div>
    <div class="formula f2">a² + b² = c²</div>
    <div class="formula f3">√2 · x + 7</div>
    <div class="formula f4">f(x) = ax² + bx + c</div>

    <div class="hero-inner">
      <div class="hero-copy">
        <div class="kicker"><span class="dot"></span> Mathématiques</div>
        <h1>
          Site de Mme Harel
          <span class="soft">apprendre • comprendre • progresser</span>
        </h1>
        <div class="school">Collège Albert Camus</div>
        <div class="place">La Norville</div>
      </div>

      <div class="visual" aria-hidden="true">
        <div class="math-card">
          <svg class="math-svg" viewBox="0 0 360 315" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#6ee7ff"/>
                <stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <g opacity=".18" stroke="#fff" stroke-width="1">
              <path d="M30 60H330M30 105H330M30 150H330M30 195H330M30 240H330"/>
              <path d="M75 30V285M120 30V285M165 30V285M210 30V285M255 30V285M300 30V285"/>
            </g>

            <g transform="translate(180 157)">
              <circle r="95" fill="none" stroke="url(#g1)" stroke-width="2.4" opacity=".9"/>
              <polygon points="0,-92 80,50 -80,50" fill="none" stroke="#f8d57e" stroke-width="2" opacity=".85"/>
              <circle r="55" fill="none" stroke="#fff" stroke-opacity=".5" stroke-dasharray="4 7"/>
              <path d="M-130 62 C-70 8,-28 86,20 25 S105 -7,135 -66" fill="none" stroke="#6ee7ff" stroke-width="3" filter="url(#glow)"/>
              <line x1="-140" y1="0" x2="140" y2="0" stroke="#fff" stroke-opacity=".38"/>
              <line x1="0" y1="-120" x2="0" y2="120" stroke="#fff" stroke-opacity=".38"/>
            </g>

            <g fill="#fff" opacity=".82" font-family="Georgia, serif">
              <text x="33" y="42" font-size="18">π</text>
              <text x="291" y="58" font-size="16">√x</text>
              <text x="300" y="278" font-size="18">∞</text>
              <text x="40" y="276" font-size="15">Σ</text>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <svg class="wave" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,45 C260,85 420,5 700,38 C980,72 1180,16 1440,42 L1440,80 L0,80 Z" fill="#f5f7fb"/>
    </svg>
  </header>

  <main>
    <section class="welcome">
      <h2>Bienvenue</h2>
      <p>
        Retrouvez ici les ressources de mathématiques de Mme Harel : cours, exercices, méthodes et documents utiles pour les élèves du collège.
      </p>
    </section>
  </main>
</body>
</html>
